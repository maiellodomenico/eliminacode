<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il tuo turno</title><style>body{font-family:Arial;background:#f2f6f3;color:#17352a;padding:24px}.card{max-width:520px;margin:auto;background:white;border-radius:24px;padding:24px}.num{font-size:64px;font-weight:900;color:#174b35}.btn{display:block;padding:14px;border-radius:14px;background:#174b35;color:#fff;text-align:center;text-decoration:none;font-weight:800}</style><div class="card"><h1>ELIMINACODE</h1><div id="state">Acquisizione ticket...</div><p>Per notifiche push complete installa l'app Eliminacode.</p><a class="btn" href="eliminacode://claim">Apri app Eliminacode</a></div><script>const p=new URLSearchParams(location.search);const ticket=p.get('ticket'),token=p.get('token');async function go(){let r=await fetch('/api/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ticketId:ticket,token})});let x=await r.json();state.innerHTML=r.ok?`<div>${x.departmentName}</div><div class=num>${x.number}</div><p>${x.peopleAhead} persone prima di te</p>`:`Errore: ${x.error}`;if(r.ok)setInterval(async()=>{let t=await fetch('/api/tickets/'+ticket).then(x=>x.json());state.innerHTML=`<div>${t.departmentName}</div><div class=num>${t.number}</div><p>Stanno servendo ${t.currentNumber}</p><p>${t.peopleAhead} persone prima di te</p>`},3000)}go()</script>
