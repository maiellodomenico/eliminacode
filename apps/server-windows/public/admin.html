<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eliminacode Server</title><style>body{font-family:Arial;background:#f2f6f3;margin:0;color:#153a2a}.top{background:#fff;padding:22px 28px;display:flex;justify-content:space-between}.brand{font-size:32px;font-weight:900}.wrap{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;padding:20px;border-radius:18px}button{background:#174b35;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700}.row{padding:10px 0;border-bottom:1px solid #e6ece8}.ok{color:#18864b;font-weight:800}@media(max-width:850px){.wrap{grid-template-columns:1fr}}</style><div class="top"><div><div class="brand">ELIMINACODE SERVER</div><div>Local-first • LAN • SQLite • WebSocket</div></div><div class="ok" id="health">Avvio...</div></div><div class="wrap"><div class="card"><h2>Reparti</h2><div id="deps"></div></div><div class="card"><h2>Dispositivi</h2><button onclick="newOp()">+ Operatore Salumeria demo</button><div id="devices"></div></div><div class="card"><h2>Coda live</h2><div id="display"></div></div><div class="card"><h2>Test</h2><button onclick="ticket('salumeria')">Crea ticket Salumeria</button><pre id="out"></pre></div></div><script>async function j(u,o){let r=await fetch(u,o);return r.json()}async function load(){health.textContent=(await j('/api/health')).ok?'ONLINE':'OFFLINE';deps.innerHTML=(await j('/api/departments')).map(x=>`<div class=row>${x.name} (${x.prefix})</div>`).join('');devices.innerHTML=(await j('/api/devices')).map(x=>`<div class=row>${x.type} • ${x.name} • ${x.department_id||'-'}</div>`).join('');display.innerHTML=(await j('/api/display')).map(x=>`<div class=row><b>${x.number}</b> ${x.department}</div>`).join('')}async function ticket(departmentId){out.textContent=JSON.stringify(await j('/api/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({departmentId})}),null,2);load()}async function newOp(){out.textContent=JSON.stringify(await j('/api/devices',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'operator',name:'Operatore Salumeria',departmentId:'salumeria'})}),null,2);load()}load();setInterval(load,2000)</script>
