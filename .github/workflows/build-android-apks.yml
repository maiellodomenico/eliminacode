name: Build Android release APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/customer-app/**'
      - 'apps/operator-tablet/**'
      - '.github/workflows/build-android-apks.yml'

jobs:
  customer-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Eliminacode-Cliente-RELEASE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eliminacode-Cliente-RELEASE-APK
          path: apps/customer-app/Eliminacode-Cliente-RELEASE.apk
          if-no-files-found: error

  operator-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-tablet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Eliminacode-Operatore-RELEASE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eliminacode-Operatore-RELEASE-APK
          path: apps/operator-tablet/Eliminacode-Operatore-RELEASE.apk
          if-no-files-found: error
