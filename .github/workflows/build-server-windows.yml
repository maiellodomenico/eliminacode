name: Build Eliminacode Server Windows

on:
  workflow_dispatch:
  push:
    branches:
      - local-first-v1
    paths:
      - 'apps/server-windows/**'
      - '.github/workflows/build-server-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/server-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Eliminacode-Server-Windows-v1
          path: apps/server-windows/release/*.exe
          if-no-files-found: error
