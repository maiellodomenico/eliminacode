name: Build Eliminacode Server Windows

"on":
  workflow_dispatch:
  push:
    branches:
      - local-first-v1
    paths:
      - "apps/server-windows/**"
      - ".github/workflows/build-server-windows.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm rebuild better-sqlite3 --runtime=node
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:browser
      - name: Start audio service for WebKit playback
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - run: xvfb-run -a npm run test:browser
        env:
          ELIMINACODE_HEADED: "1"
          ELIMINACODE_BROWSER: webkit
          ELIMINACODE_TEST_OUTPUT: test-output/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eliminacode-UI-verificata-v1.2.3
          path: apps/server-windows/test-output/
          if-no-files-found: ignore

  build:
    needs: browser
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/server-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Prepare native module for Node.js tests
        # electron's postinstall may rebuild native modules for Electron;
        # use the Node ABI for the API tests before packaging rebuilds them.
        run: npm rebuild better-sqlite3 --runtime=node

      - name: Test server startup and API
        run: npm test

      - name: Bundle verified outbound tunnel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-windows-amd64.exe" -OutFile vendor/cloudflared.exe
          $digest = (Get-FileHash vendor/cloudflared.exe -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne "86aee4017b26625cee8484c113558f48effa4cd47f7aa05fcf425604e5d2b23c") { throw "Tunnel binary integrity check failed" }

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Verify packaged Windows application
        shell: pwsh
        run: |
          $env:ELIMINACODE_DATA_DIR = Join-Path $env:RUNNER_TEMP "eliminacode-smoke"
          $appPath = Join-Path (Get-Location) "release/win-unpacked/Eliminacode Server.exe"
          $process = Start-Process -FilePath $appPath -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Packaged application did not exit" }
          if ($process.ExitCode -ne 0) { Get-Content "$env:ELIMINACODE_DATA_DIR/bootstrap.log"; throw "Packaged application startup failed" }
          if (-not (Test-Path "$env:ELIMINACODE_DATA_DIR/smoke-ok.txt")) { throw "Missing packaged smoke-test result" }
          Get-Content "$env:ELIMINACODE_DATA_DIR/smoke-ok.txt"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Eliminacode-Suite-Windows-v1.2.3
          path: apps/server-windows/release/*.exe
          if-no-files-found: error
