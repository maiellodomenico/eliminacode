name: Build Windows Totem EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/totem-windows/**'
      - '.github/workflows/build-windows-totem.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/totem-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable EXE
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Eliminacode-Totem-Windows-EXE
          path: apps/totem-windows/release/*.exe
          if-no-files-found: error

